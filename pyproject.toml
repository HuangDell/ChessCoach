[project]
name = "chess-review-coach"
version = "0.1.0"
description = "A local, single-user web application for Stockfish-grounded chess review and coaching."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
    "python-chess>=1.999,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
agent = ["openai-agents==0.22.0"]

[project.scripts]
chess-review-coach = "server.web.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.hatch.build.targets.wheel.force-include]
"frontend" = "server/_frontend"
